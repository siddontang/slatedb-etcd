# Reads of a member's SlateDB database must hold a `ReadGuard`, or GC may delete an SST
# that they still use. `StateRead` takes one for each read.
disallowed-methods = [
  { path = "slatedb::Db::get", reason = "read through StateRead so the read holds a ReadGuard (src/state/read_guard.rs)" },
