[package]
name = "slatedb-etcd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http2"] }
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
protobuf = "2.28"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
raft-engine = { version = "0.4", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "8b68800252064164397ca6ce53e5883dcfbc37b9", default-features = false, features = ["wal_disable"] }
slog = "2.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
