[package]
name = "slatedb-etcd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
fault-injection = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http2"] }
bincode = "1.3"
bytes = { version = "1", features = ["serde"] }
bcrypt = "0.17"
crc32c = "0.6"
sha2 = "0.10"
jsonwebtoken = "9"
clap = { version = "4", features = ["derive"] }
protobuf = "2.28"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
raft-engine = { path = "third_party/raft-engine", version = "0.4.2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slatedb = { git = "https://github.com/slatedb/slatedb.git", rev = "8b68800252064164397ca6ce53e5883dcfbc37b9", default-features = false, features = ["wal_disable", "aws", "moka"] }
slog = "2.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

tokio-stream = "0.1"
prost = "0.13"
prost-types = "0.13"
http-body = "1"
prometheus = { version = "0.13", features = ["process"] }
tonic-health = "0.12"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.18"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tonic = { version = "0.12", features = ["transport", "tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
