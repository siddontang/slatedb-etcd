[package]
name = "slatedb-etcd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
fault-injection = []
write-profile = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["http2"] }
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
bytes = { version = "1", features = ["serde"] }
bcrypt = "0.19"
crc32c = "0.6"
lz4_flex = "0.14"
sha2 = "0.11"
hex = "0.4"
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
clap = { version = "4", features = ["derive"] }
protobuf = "2.28"
raft = { version = "0.7", default-features = false, features = ["protobuf-codec"] }
raft-engine = { path = "third_party/raft-engine", version = "0.4.2", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slatedb = { version = "0.18.1", default-features = false, features = ["wal_disable", "aws", "moka"] }
slog = "2.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

tokio-stream = "0.1"
prost = "0.14"
prost-types = "0.14"
http-body = "1"
prometheus = { version = "0.14", features = ["process"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
