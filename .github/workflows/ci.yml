name: Verify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      extended:
        description: Run 100 DST seeds and 16 process fault seeds
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-files:
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned secret scanner
        run: |
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks" >> "$GITHUB_ENV"
      - name: Select new commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Main history was checked when it landed. Check only the commits this event adds.
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="$(git rev-parse origin/main)" ;;
          esac
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            echo "No base commit for $EVENT" >&2
            exit 1
          fi
          echo "HISTORY_RANGE=$base..HEAD" >> "$GITHUB_ENV"
      - name: Select verification tier
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          tier=full
          if [[ "$EVENT" == pull_request && "$FORCE_FULL" != true ]]; then
            # Include both names of a rename. A diff error must fail classification.
            git diff --no-renames --name-only -z "$PR_BASE...HEAD" > "$RUNNER_TEMP/changed-paths"
            if [[ -s "$RUNNER_TEMP/changed-paths" ]]; then
              tier=fast
              while IFS= read -r -d '' path; do
                case "$path" in
                  README.md|AGENTS.md|COMPATIBILITY.md|CONTRIBUTING.md|RESULTS.md|SECURITY.md|LICENSE|NOTICE|\
                  docs/*.md|results/*.md|results/*.json|tests/README.md|.github/pull_request_template.md|\
                  examples/*.rs|tests/embedded.rs|tests/engine_sync.rs|tests/recovery.rs|tests/shared_state.rs|\
                  src/metrics.rs|src/metrics/*.rs|src/grpc/health.rs)
                    continue ;;
                  *) tier=full; break ;;
                esac
              done < "$RUNNER_TEMP/changed-paths"
            fi
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Verification tier: $tier" >> "$GITHUB_STEP_SUMMARY"
      - name: Check publication files and history
        run: |
          python3 scripts/check-public.py
          python3 scripts/test_reporting.py
          python3 scripts/test_s3.py
          python3 scripts/test_benchmark.py
          python3 scripts/test_profile.py
          python3 scripts/test_history.py
          python3 scripts/check-history.py --range "$HISTORY_RANGE"
          python3 scripts/test_secret_scan.py
          python3 scripts/check-secrets.py
  build:
    needs: public-files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release binaries
        run: |
          scripts/cargo.sh build --locked --release --features fault-injection
          mkdir -p tmp/binaries
          cp target/release/slatedb-etcd tmp/binaries/slatedb-etcd-fault
          scripts/cargo.sh build --locked --release
          cp target/release/slatedb-etcd tmp/binaries/slatedb-etcd
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: tmp/binaries/
          retention-days: 3

  rust:
    needs: public-files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Select test seeds
        env:
          EXTENDED: ${{ inputs.extended }}
        run: |
          python3 - <<'PY'
          import os
          extended = os.environ["EXTENDED"] == "true"
          with open(os.environ["GITHUB_ENV"], "a") as env:
              dst = ",".join(map(str, range(1, 101))) if extended else "1,2,42,58,70"
              faults = ",".join(map(str, range(1, 17))) if extended else "1,2,3,4"
              env.write(f"SLATEDB_DST_SEEDS={dst}\nFAULT_SEEDS={faults}\n")
          PY
      - name: Check the Rust Protobuf dependency graph
        run: |
          cargo metadata --locked --all-features --format-version 1 | python3 -c '
          import json, sys
          metadata = json.load(sys.stdin)
          packages = metadata["packages"]
          names = {p["id"]: p["name"] for p in packages}
          # Raft Engine and its Prometheus 0.13 link rust-protobuf 2. No other crate may use it.
          users = {names[n["id"]] for n in metadata["resolve"]["nodes"]
                   for d in n["deps"] if names[d["pkg"]] == "protobuf"}
          assert users <= {"raft-engine", "prometheus"}, users
          versions = {p["version"] for p in packages if p["name"] in
                      {"prost", "prost-build", "prost-derive", "prost-types"}}
          assert len(versions) == 1 and versions.pop().startswith("0.14.")'
      - name: Check Rust
        run: |
          cargo fmt --check
          cargo run --locked -- --help >/dev/null
          scripts/cargo.sh clippy --locked --all-targets --all-features -- -D warnings
          scripts/cargo.sh test --locked --features write-profile --lib write_profile::tests
          scripts/cargo.sh test --locked -- --skip seeded_fault_schedules_replay_identically
          python3 scripts/check-dst.py --seeds "$SLATEDB_DST_SEEDS" --output results/ci/dst.json
      - name: Save DST report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dst-report
          path: results/ci/*.json
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: tests/compat/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: target/release
      # Clusters of several members run in shared state mode on this job's RustFS server.
      - uses: ./.github/actions/rustfs
      - name: Run official-client KV and metrics tests
        run: |
          chmod +x target/release/slatedb-etcd
          python3 scripts/check-compat.py --run '^(TestDifferentialKV|TestMetricsCountAppliedWrites)$' \
            --output results/ci/smoke.json
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          report = json.loads(Path("results/ci/smoke.json").read_text())
          passed = {t["name"] for t in report["tests"] if t["result"] == "pass"}
          assert report["complete"] and {"TestDifferentialKV", "TestMetricsCountAppliedWrites"} <= passed
          PYTHON

  compat-upstream:
    needs: [public-files, build]
    if: needs.public-files.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            tests/compat/go.sum
            tests/downstream/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: target/release
      - name: Restore binary permissions
        run: chmod +x target/release/slatedb-etcd target/release/slatedb-etcd-fault
      # Clusters of several members run in shared state mode on this job's RustFS server.
      - uses: ./.github/actions/rustfs
      - name: Check the imported upstream etcd suites
        run: |
          python3 scripts/check-compat.py --tags upstream --all-capabilities \
            --output results/ci/etcd-upstream.json
      - name: Save upstream compatibility report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: upstream-compatibility-report
          path: results/ci/*.json
          retention-days: 14

  upstream-process:
    needs: [public-files, build]
    if: needs.public-files.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            tests/compat/go.sum
            tests/downstream/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: target/release
      - name: Restore binary permissions
        run: chmod +x target/release/slatedb-etcd target/release/slatedb-etcd-fault
      - name: Check out the upstream etcd test source
        uses: actions/checkout@v4
        with:
          repository: etcd-io/etcd
          ref: a0614505aff9b8ff469e9c59c2d979a5936d13f4
          path: reference/etcd
          persist-credentials: false
      # Clusters of several members run in shared state mode on this job's RustFS server.
      - uses: ./.github/actions/rustfs
      - name: Run the official etcd benchmarks and process tests
        run: |
          # Build upstream tests with the Go release upstream pins. Its goroutine leak filter
          # does not know the TLS cache cleanup that Go 1.25 adds.
          export GOTOOLCHAIN="go$(cat reference/etcd/.go-version)"
          go version
          python3 scripts/test_upstream.py
          python3 scripts/check-upstream-go.py go-bench --require-complete \
            --package tests/integration/clientv3/experimental/recipes --output results/ci/upstream-go
          python3 scripts/benchmark-upstream.py --output results/ci/upstream-bench
          python3 scripts/check-upstream-go.py e2e --target service --require-complete \
            --run '^TestVerifyHashKVAfterCompact$/current-version' --output results/ci/upstream-go
          python3 scripts/check-upstream-go.py common --target service --timeout 12m \
            --expect-passes tests/upstream/autotls-cases.txt --output results/ci/upstream-go
          python3 scripts/check-upstream-go.py examples --target service --require-complete \
            --timeout 2m --output results/ci/upstream-go
      - name: Compare the official 256-client mixed transactions
        run: |
          for members in 1 3; do
            python3 scripts/benchmark-upstream.py --members "$members" --profile stress \
              --case mixed-256 --output "results/ci/upstream-mixed-$members"
          done
      - name: Save the upstream results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-smoke
          path: results/ci/upstream-*

  service-tests:
    needs: [public-files, build]
    if: needs.public-files.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            tests/compat/go.sum
            tests/downstream/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tests/jepsen/project.clj
      - name: Install pinned Jepsen test runner
        run: |
          curl --fail --location --retry 3 \
            https://github.com/technomancy/leiningen/releases/download/2.11.2/leiningen-2.11.2-standalone.jar \
            --output "$RUNNER_TEMP/lein.jar"
          echo "7d31ae23ae769e927438b0cd55d15a93e7dabab09fd4fc15877979161e108774  $RUNNER_TEMP/lein.jar" | sha256sum --check
          echo "LEIN_JAR=$RUNNER_TEMP/lein.jar" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: target/release
      - name: Restore binary permissions
        run: chmod +x target/release/slatedb-etcd target/release/slatedb-etcd-fault
      # Clusters of several members run in shared state mode on this job's RustFS server.
      - uses: ./.github/actions/rustfs
      - name: Fetch Jepsen dependencies
        working-directory: tests/jepsen
        timeout-minutes: 6
        run: |
          for attempt in 1 2; do
            echo "Resolve Jepsen dependencies (attempt $attempt of 2)"
            if timeout --kill-after=5s 150s java -cp "$LEIN_JAR" clojure.main -m leiningen.core.main deps; then
              exit 0
            fi
          done
          exit 1
      - name: Test the Jepsen checker
        timeout-minutes: 5
        run: python3 scripts/check-jepsen.py --self-test
      - name: Check process faults with etcd and Jepsen models
        timeout-minutes: ${{ inputs.extended && 40 || 12 }}
        env:
          EXTENDED: ${{ inputs.extended }}
        run: |
          seeds=1,2,3,4
          if [ "$EXTENDED" = true ]; then seeds=$(seq 1 16 | paste -sd, -); fi
          python3 scripts/check-robustness.py --seeds "$seeds" --jepsen \
            --output results/ci/robustness.json
      - name: Check etcd compatibility and recovery
        run: |
          python3 scripts/check-compat.py --output results/ci/etcd-compatibility.json
          python3 scripts/harness.py test --output results/ci/etcd-core-fault-tests.json
      - name: Check S3 recovery and downstream projects
        run: |
          python3 scripts/check-s3.py --output results/ci/s3-recovery.json
          python3 scripts/check-compat.py --suite downstream --output results/ci/downstream.json
      - name: Check native crash boundaries
        run: |
          python3 scripts/check-compat.py --binary target/release/slatedb-etcd-fault \
            --tags failpoints --run '^TestFailpoint(Recovery|AutoCompaction|SharedRestore)$' --output results/ci/failpoints.json
      - name: Run bounded API fuzzing
        run: |
          cd tests/compat
          go test -mod=readonly -run '^$' -fuzz '^FuzzKVSequence$' -fuzztime=10x -timeout=2m -parallel=1
      - name: Record test results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              for path in sorted(Path("results/ci").glob("*.json")):
                  report = json.loads(path.read_text())
                  state = "passed" if report["passed"] else "failed"
                  summary.write(f"- {path.name}: {state}\n")
                  print(path.name)
                  print(path.read_text())
          PY
      - name: Save validation reports
        if: always()
        # Full reports also remain in the job logs if artifact storage is unavailable.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: results/ci/*.json
          retention-days: 14

  test:
    if: always()
    needs: [public-files, rust, build, smoke, upstream-process, service-tests, compat-upstream,
            performance-build, performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the checks for the selected tier
        env:
          TIER: ${{ needs.public-files.outputs.tier }}
          JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          tier = os.environ["TIER"]
          if tier not in ("fast", "full"):
              raise SystemExit("Missing verification tier")
          always = {"public-files", "rust", "build", "smoke"}
          for job, details in json.loads(os.environ["JOBS"]).items():
              expected = "success" if tier == "full" or job in always else "skipped"
              if details["result"] != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {details['result']}")
          PYTHON

  performance-build:
    needs: public-files
    if: needs.public-files.outputs.tier == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_RELEASE_DEBUG: 1
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Select the base commit
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "BASE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
          fi
      # Main runs save their head binaries. A later pull request on that main tip reuses them as base.
      - name: Restore base binaries
        id: base-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/performance-head
          key: performance-binaries-${{ env.BASE_SHA }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Build head and base with the same settings
        env:
          BASE_CACHED: ${{ steps.base-cache.outputs.cache-hit }}
        run: |
          mkdir -p tmp/performance
          cargo build --locked --release
          cp target/release/slatedb-etcd tmp/performance/head
          cargo build --locked --release --features write-profile
          cp target/release/slatedb-etcd tmp/performance/head-counted
          if [ "$BASE_CACHED" = true ]; then
            cp tmp/performance-head/head tmp/performance/base
            cp tmp/performance-head/head-counted tmp/performance/base-counted
          else
            git worktree add --detach "$RUNNER_TEMP/performance-base" "$BASE_SHA"
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --release \
              --manifest-path "$RUNNER_TEMP/performance-base/Cargo.toml"
            cp target/release/slatedb-etcd tmp/performance/base
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked --release \
              --features write-profile --manifest-path "$RUNNER_TEMP/performance-base/Cargo.toml"
            cp target/release/slatedb-etcd tmp/performance/base-counted
            git worktree remove "$RUNNER_TEMP/performance-base"
          fi
          mkdir -p tmp/performance-head
          cp tmp/performance/head tmp/performance/head-counted tmp/performance-head/
      - name: Save head binaries for later base comparisons
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: tmp/performance-head
          key: performance-binaries-${{ github.sha }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: actions/upload-artifact@v4
        with:
          name: performance-binaries
          path: tmp/performance/
          retention-days: 3

  # Each group compares head and base on one runner. Groups run on separate runners in parallel.
  performance:
    needs: performance-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [writes, throughput]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: tests/compat/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: performance-binaries
          path: tmp/performance
      - name: Restore binary permissions
        run: chmod +x tmp/performance/*
      # Clusters of several members run in shared state mode on this job's RustFS server.
      - uses: ./.github/actions/rustfs
      - name: Install Linux profiling tools
        if: matrix.group != 'throughput'
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic
          perf_path="$(find -L /usr/lib/linux-tools -type f -name perf | sort | tail -1)"
          test -n "$perf_path"
          sudo ln -sf "$perf_path" /usr/local/bin/perf
          sudo sysctl kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - name: Measure three-member write costs
        if: matrix.group == 'writes'
        run: |
          python3 scripts/benchmark-etcd.py --binary tmp/performance/head-counted \
            --baseline-binary tmp/performance/base-counted --backends baseline service \
            --concurrency 32 --read-percent 0 --value-pattern metadata --requests 12000 \
            --keys 1000 --value-size 256 --warmup 200 --repeat 3 --output results/ci/write-cost.json
          for kind in service etcd; do
            binary=tmp/performance/head
            if [ "$kind" = etcd ]; then binary=tmp/benchmark-tools/etcd; fi
            python3 scripts/profile-linux.py --binary "$binary" --backend "$kind" \
              --concurrency 32 --read-percent 0 --requests 12000 --value-pattern metadata \
              --output "results/ci/capacity-$kind" --skip-inline
          done
      - name: Compare writes through all members and each role
        if: matrix.group == 'writes'
        run: |
          python3 scripts/benchmark-etcd.py --binary tmp/performance/head \
            --baseline-binary tmp/performance/base --concurrency 32 --read-percent 0 \
            --value-pattern metadata --requests 12000 --keys 1000 --value-size 256 \
            --warmup 200 --repeat 3 --output results/ci/benchmark-metadata.json
          for role in leader follower; do
            python3 scripts/benchmark-etcd.py --binary tmp/performance/head \
              --client-target "$role" --concurrency 32 --read-percent 0 --value-pattern metadata \
              --requests 12000 --keys 1000 --value-size 256 --warmup 200 --repeat 3 \
              --output "results/ci/route-$role.json"
          done
      - name: Save write cost measurements
        if: matrix.group == 'writes'
        uses: actions/upload-artifact@v4
        with:
          name: linux-write-cost
          retention-days: 14
          path: |
            results/ci/write-cost.json
            results/ci/benchmark-metadata.json
            results/ci/route-*.json
            results/ci/capacity-*/*.txt
            results/ci/capacity-*/*.json
      - name: Compare server resources at the same write rate
        if: matrix.group == 'writes'
        run: |
          python3 scripts/benchmark-etcd.py --binary tmp/performance/head \
            --baseline-binary tmp/performance/base --rate 1000 --concurrency 32 --read-percent 0 \
            --requests 6000 --keys 1000 --value-size 256 --warmup 200 --repeat 3 \
            --output results/ci/benchmark-paced.json
      - name: Compare binary writes
        if: matrix.group == 'writes'
        run: |
          python3 scripts/benchmark-etcd.py --binary tmp/performance/head \
            --baseline-binary tmp/performance/base --concurrency 32 --read-percent 0 \
            --value-pattern binary --requests 12000 --keys 1000 --value-size 256 \
            --warmup 200 --repeat 3 --output results/ci/benchmark-binary.json
      - name: Compare throughput, latency, CPU, and memory
        if: matrix.group == 'throughput'
        run: |
          python3 scripts/benchmark-etcd.py --binary tmp/performance/head             --baseline-binary tmp/performance/base --baseline-concurrency 8 32             --requests 5000 --read-requests 60000             --keys 1000 --value-size 256 --concurrency 1 8 32 --read-percent 0 50 100             --warmup 200 --repeat 3 --output results/ci/benchmark-linux.json
          python3 scripts/summarize-benchmark.py results/ci/benchmark-linux.json             --output results/ci/benchmark-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Compare writes during physical compaction
        if: matrix.group == 'writes'
        run: |
          python3 scripts/benchmark-etcd.py --binary tmp/performance/head \
            --baseline-binary tmp/performance/base --concurrency 32 --read-percent 0 --rate 1000 \
            --compact-every 2500 --retain-revisions 500 --value-pattern metadata \
            --requests 10000 --keys 1000 --warmup 200 --repeat 2 \
            --output results/ci/benchmark-compact.json
      - name: Compare writes during physical compaction on RustFS
        if: matrix.group == 'writes'
        run: |
          python3 scripts/benchmark-etcd.py --rustfs --binary tmp/performance/head \
            --baseline-binary tmp/performance/base --backends baseline service \
            --concurrency 32 --read-percent 0 --rate 300 --value-pattern metadata \
            --compact-every 750 --retain-revisions 250 --requests 3000 --keys 1000 \
            --warmup 200 --repeat 2 --output results/ci/benchmark-rustfs.json
          python3 scripts/benchmark-etcd.py --rustfs --binary tmp/performance/head \
            --backends service --concurrency 32 --read-percent 0 --rate 1000 \
            --value-pattern metadata --compact-every 2500 --retain-revisions 500 \
            --requests 10000 --keys 1000 --warmup 200 --repeat 2 \
            --output results/ci/benchmark-rustfs-stress.json
      - name: Sample Linux CPU stacks after warmup
        if: matrix.group == 'writes'
        run: |
          for backend in base head; do
            python3 scripts/profile-linux.py --binary "tmp/performance/$backend"               --read-percent 0 --requests 5000 --output "results/ci/profile-$backend-write"
            python3 scripts/profile-linux.py --binary "tmp/performance/$backend"               --read-percent 100 --requests 60000 --output "results/ci/profile-$backend-read"
          done
      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-performance-${{ matrix.group }}
          path: |
            results/ci/*.json
            results/ci/profile-*/*.json
            results/ci/profile-*/*.txt
            results/ci/profile-*/*.log
          retention-days: 14
