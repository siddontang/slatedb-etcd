name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: tests/compat/go.sum
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check Rust
        run: |
          cargo fmt --check
          scripts/cargo.sh clippy --locked --all-targets -- -D warnings
          scripts/cargo.sh test --locked
          scripts/cargo.sh build --locked --release
      - name: Check etcd compatibility and recovery
        run: |
          python3 scripts/check-compat.py
          python3 scripts/harness.py test --output results/etcd-core-fault-tests.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            results/etcd-compatibility.json
            results/etcd-core-fault-tests.json
