syntax = "proto3";
package slatedb_state;

import "kv.proto";

// A missing value records a deleted key at this revision.
message Version {
  bytes key = 1;
  int64 revision = 2;
  mvccpb.KeyValue value = 3;
}

message Journal {
  repeated mvccpb.Event events = 1;
  // A positive entry names the history revision that holds the previous value of the event at
  // the same position. The event then omits prev_kv. Zero or a missing entry keeps prev_kv inline.
  repeated int64 prev_revisions = 2;
}
