syntax = "proto3";
package slatedb_state;

import "kv.proto";

// A missing value records a deleted key at this revision.
message Version {
  bytes key = 1;
  int64 revision = 2;
  mvccpb.KeyValue value = 3;
}

message Journal {
  repeated mvccpb.Event events = 1;
  // A positive entry names the history revision that holds the previous value of the event at
  // the same position. The event then omits prev_kv. Zero or a missing entry keeps prev_kv inline.
  repeated int64 prev_revisions = 2;
  // When true, Put events omit kv.value. The history version of kv.key at kv.mod_revision holds
  // the full KeyValue.
  bool values_in_history = 3;
}

// The logical size of all `etcd/` rows after the apply index `applied`. The row is valid only
// when `applied` equals the apply marker. Older binaries do not update it.
//
// `bytes` is the total. The optional fields split it by row kind, as `batch::Usage` does. Rows
// from binaries that wrote only `bytes` lack the split, so readers count the rows again.
message LogicalSize {
  uint64 applied = 1;
  uint64 bytes = 2;
  optional uint64 current = 3;
  optional uint64 history = 4;
  optional uint64 journal = 5;
  optional uint64 other = 6;
}
