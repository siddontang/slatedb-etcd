# Three guests share a physical host. Keep their files and networks separate.
images:
- location: https://cloud-images.ubuntu.com/releases/noble/release-20260926/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
  digest: sha256:1d6bffe64b848468ac97f821d369a4846d983de1800ccf6b5ec8853e85cefc55
vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
disk: 16GiB
mounts: []
containerd:
  system: false
  user: false
networks:
- lima: user-v2
portForwards:
- guestPortRange: [1, 65535]
  proto: any
  ignore: true
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler curl iptables
